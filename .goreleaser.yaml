version: 2

project_name: aria-core

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/aria-core
    binary: aria-core
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    format_overrides:
      - goos: windows
        formats:
          - zip

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^ci:"

brews:
  - repository:
      owner: ITECHDEV-MX
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    directory: Formula
    name: aria-core
    homepage: "https://github.com/ITECHDEV-MX/aria-core"
    description: "ARIA Core — motor de memoria persistente para agentes de IA. Multi-tenant, single binary."
    license: "MIT"
    commit_msg_template: "chore: update aria-core formula to {{ .Tag }}"
