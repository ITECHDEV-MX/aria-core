name: Skills Validate

on:
  pull_request:
    paths:
      - "skills/**"
      - ".github/workflows/skills-validate.yml"
      - "internal/skills/**"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    name: Validate SKILL.md files
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache: true

      - name: Build aria-core
        run: go build -o /tmp/aria-core ./cmd/aria-core

      - name: Validate skills (strict)
        id: validate
        run: |
          /tmp/aria-core skills validate ./skills --strict --json | tee /tmp/skills-validate.json
          echo ""
          /tmp/aria-core skills validate ./skills --strict

      - name: Upload validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: skills-validation-report
          path: /tmp/skills-validate.json
          retention-days: 30

      - name: Check PR has skill dossier
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Pull the PR body and ensure it contains the dossier section
          # markers that the .github/PULL_REQUEST_TEMPLATE/skill.md file
          # writes. This is advisory in F1.a — only warn, don't fail —
          # because not every PR touching skills/ is a new skill.
          PR_BODY=$(gh pr view ${{ github.event.pull_request.number }} --json body -q .body)
          if echo "$PR_BODY" | grep -qE "## Trigger conditions|## Rationale|## Risks of NOT adopting"; then
            echo "✓ Dossier sections detected in PR body."
          else
            echo "::warning::PR body does not include dossier sections (Trigger conditions / Rationale / Risks). For a new skill, use the skill PR template."
          fi
