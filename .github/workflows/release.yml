# Workflow de release para aria-core.
# Se dispara cuando se pushea un tag con prefijo `v` (ej: v0.1.0).
# Usa goreleaser con `.goreleaser.yaml` del root para construir binarios
# cross-platform (linux/darwin × amd64/arm64) y publicarlos como assets
# del GitHub Release asociado a la tag.

name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write   # necesario para crear el release y subir assets
  packages: write   # por si goreleaser publica imágenes/paquetes

jobs:
  goreleaser:
    name: GoReleaser
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # goreleaser necesita historia completa para changelog y diff
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "^1.25"
          cache: true

      - name: Ejecutar GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          # Token estándar de la action para crear el release
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Token con scope para el tap de Homebrew (configurado por separado)
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
