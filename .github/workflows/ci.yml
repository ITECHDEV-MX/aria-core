# Workflow de CI principal para aria-core.
# Se dispara en push a `main` y en pull requests dirigidos a `main`.
# Corre lint, tests, build de verificación y checa que `templ generate`
# no produzca diff (los archivos generados deben estar committeados).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: "^1.25"

jobs:
  lint:
    name: Lint (golangci-lint)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.62.2
          args: --timeout=5m

  test:
    name: Test (go test ./...)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Descargar módulos
        run: go mod download

      - name: Ejecutar tests
        run: go test ./... -race -count=1

  build:
    name: Build (cmd/aria-core)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Compilar binario
        run: go build -o /tmp/aria-core ./cmd/aria-core

  templ-check:
    name: Templ generate (verificar diff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Instalar templ
        run: go install github.com/a-h/templ/cmd/templ@v0.3.857

      - name: Regenerar templ
        run: templ generate

      - name: Verificar que no haya diff
        run: |
          if ! git diff --exit-code; then
            echo "::error::Hay diferencias después de 'templ generate'."
            echo "::error::Corré 'templ generate' localmente y commiteá los archivos *_templ.go."
            exit 1
          fi
