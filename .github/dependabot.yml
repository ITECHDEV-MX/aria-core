# Configuración de Dependabot para aria-core.
# Actualiza módulos Go y GitHub Actions semanalmente (lunes).
version: 2

updates:
  # Dependencias de módulos Go
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Mexico_City"
    open-pull-requests-limit: 5
    labels:
      - "type:chore"
      - "deps"
    commit-message:
      prefix: "chore(deps)"
    reviewers:
      - "Gentleman-Programming"

  # GitHub Actions usadas en .github/workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/Mexico_City"
    open-pull-requests-limit: 3
    labels:
      - "type:chore"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
    reviewers:
      - "Gentleman-Programming"
